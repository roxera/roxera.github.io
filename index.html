<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXERA // roxera.net</title>
    <style>
        :root {
            --primary-glow: rgba(0, 195, 255, 0.4);
            --crt-scanline: rgba(18, 16, 16, 0);
            --crt-scanline-dark: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #03070d;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        /* Фоновая сетка и виньетка */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(0, 162, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 162, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Эффект сканлайнов ЭЛТ-монитора */
        .scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                var(--crt-scanline) 50%, 
                var(--crt-scanline-dark) 51%
            );
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.7;
            z-index: 3;
        }

        .terminal-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Верхний и нижний статус-бары */
        .system-meta {
            color: #0084ff;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(0, 132, 255, 0.6);
            display: flex;
            gap: 20px;
            text-transform: uppercase;
        }

        .system-meta span {
            animation: pulse 2s infinite ease-in-out;
        }

        #terminal {
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            font-weight: 700;
            line-height: 1.0;
            letter-spacing: 0;
            white-space: pre;
            background-color: transparent;
            margin: 0;
            padding: 0;
            display: inline-block;
            transform-origin: center center;
            text-shadow: 0 0 6px var(--primary-glow);
            cursor: pointer;
            transition: transform 0.05s ease-out;
        }

        .footer-links {
            margin-top: 18px;
            display: flex;
            gap: 24px;
            font-size: 13px;
            letter-spacing: 1px;
            z-index: 10;
        }

        .footer-links a {
            color: #00c8ff;
            text-decoration: none;
            opacity: 0.6;
            transition: all 0.2s ease;
            position: relative;
            padding: 4px 8px;
            border: 1px solid transparent;
        }

        .footer-links a:hover {
            opacity: 1;
            border-color: rgba(0, 200, 255, 0.4);
            background: rgba(0, 200, 255, 0.08);
            text-shadow: 0 0 8px #00e1ff;
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.2);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="terminal-container">
    <div class="system-meta">
        <div>CORE: <span>ONLINE</span></div>
        <div>// STATUS: <span>FUCK YOURSELF</span> //</div>
        <div id="ping-display">PING: 24ms</div>
    </div>

    <pre id="terminal"></pre>

    <div class="footer-links">
        <a href="https://tg.roxera.net" target="_blank">[ TELEGRAM ]</a>
        <a href="https://github.com/roxera" target="_blank">[ GITHUB ]</a>
        <a href="mailto:dulciloquium@roxera.net" target="_blank">[ CONTACT ]</a>
    </div>
</div>

<script>
    const termElement = document.getElementById('terminal');
    const pingElement = document.getElementById('ping-display');

    const rawText = [
        "      ██████╗   ██████╗  ██╗  ██╗ ███████╗ ██████╗   █████╗ ",
        "     ██╔══██╗ ██╔═══██╗ ╚██╗██╔╝ ██╔════╝ ██╔══██╗ ██╔══██╗",
        "    ██████╔╝ ██║   ██║  ╚███╔╝  █████╗   ██████╔╝ ███████║",
        "   ██╔══██╗ ██║   ██║  ██╔██╗  ██╔══╝   ██╔══██╗ ██╔══██║",
        "  ██║  ██║ ╚██████╔╝ ██╔╝╚██╗ ███████╗ ██║  ██║ ██║  ██║",
        " ╚═╝  ╚═╝  ╚═════╝  ╚═╝  ╚═╝ ╚══════╝ ╚═╝  ╚═╝ ╚═╝  ╚═╝"
    ];

    const TEXT_W = Math.max(...rawText.map(r => r.length));
    const TEXT_ROXERA = rawText.map(r => r.padEnd(TEXT_W, ' '));

    const GRID_W = 80;
    const GRID_H = 38;

    const TEXT_OFFSET_X = Math.floor((GRID_W - TEXT_W) / 2);
    const TEXT_OFFSET_Y = Math.floor((GRID_H - TEXT_ROXERA.length) / 2);

    const GRADIENT = ['#001ff5', '#005eff', '#0084ff', '#00a2ff', '#00c8ff', '#00e1ff', '#00f5ff', '#00e1ff', '#00c8ff', '#00a2ff', '#0084ff', '#005eff'];
    const GLITCH_CHARS = ["0", "1", "█", "▄", "▀", "░", "▒", "▓", "$", "#", "@", "%", "&", "*", "X", "¥", "§"];

    let frame = 0;
    let stateIdx = 0;
    let stateFrame = 0;
    let forceGlitch = 0;

    const states = [
        { name: "STATIC_TEXT",     duration: 60 },
        { name: "GLITCH_WIPE",     duration: 50 },
        { name: "STATIC_LOGO",     duration: 60 },
        { name: "LASER_SCAN",      duration: 45 },
        { name: "STATIC_TEXT_2",   duration: 60 },
        { name: "MATRIX_CASCADE",  duration: 65 },
        { name: "STATIC_LOGO_2",   duration: 60 },
        { name: "NOISE_CRASH",     duration: 35 }
    ];

    function getTextCell(lx, ly) {
        if (ly >= TEXT_OFFSET_Y && ly < TEXT_OFFSET_Y + TEXT_ROXERA.length &&
            lx >= TEXT_OFFSET_X && lx < TEXT_OFFSET_X + TEXT_W) {
            
            let textY = ly - TEXT_OFFSET_Y;
            let textX = lx - TEXT_OFFSET_X;
            let char = TEXT_ROXERA[textY][textX];
            
            if (char !== " ") {
                let colorIdx = (textX + frame) % GRADIENT.length;
                return `<span style="color:${GRADIENT[colorIdx]}">${char}</span>`;
            }
        }
        return " ";
    }

    function getLogoCell(lx, ly) {
        const cx = 40, cy = 38; 
        function getPixelColor(x, y) {
            let dx = x - cx;
            let dy = y - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist <= 28) {
                let wavePhase = frame * 0.14;
                let freq = 0.1; 
                let waveY = cy + 8 * Math.sin(dx * freq - wavePhase);
                
                if (Math.abs(y - waveY) < 4.5) return '#ffffff';
                return (y < waveY) ? '#00c8ff' : '#00268a';     
            }
            return null; 
        }

        let cTop = getPixelColor(lx, ly * 2);
        let cBottom = getPixelColor(lx, ly * 2 + 1);
        
        if (!cTop && !cBottom) return " ";
        if (cTop === cBottom) return `<span style="color:${cTop}">█</span>`;
        if (cTop && !cBottom) return `<span style="color:${cTop}">▀</span>`;
        if (!cTop && cBottom) return `<span style="color:${cBottom}">▄</span>`;
        return `<span style="color:${cBottom};background-color:${cTop}">▄</span>`;
    }

    function getRandomGlitch() {
        let char = GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
        let color = GRADIENT[Math.floor(Math.random() * GRADIENT.length)];
        return `<span style="color:${color};text-shadow: 0 0 10px #ffffff;">${char}</span>`;
    }

    function render() {
        const state = states[stateIdx];
        let htmlOutput = "";
        let progress = stateFrame / state.duration;

        for (let ly = 0; ly < GRID_H; ly++) {
            for (let lx = 0; lx < GRID_W; lx++) {
                
                if (forceGlitch > 0 && Math.random() < 0.2) {
                    htmlOutput += getRandomGlitch();
                    continue;
                }

                switch (state.name) {
                    case "STATIC_TEXT":
                    case "STATIC_TEXT_2":
                        htmlOutput += getTextCell(lx, ly);
                        break;

                    case "STATIC_LOGO":
                    case "STATIC_LOGO_2":
                        htmlOutput += getLogoCell(lx, ly);
                        break;

                    case "GLITCH_WIPE": {
                        let waveX = progress * (GRID_W + 15) - 7;
                        let edgeShift = Math.sin(ly * 0.5 + frame) * 3;
                        let currentBoundary = waveX + edgeShift;

                        if (lx < currentBoundary - 4) {
                            htmlOutput += getLogoCell(lx, ly);
                        } else if (lx > currentBoundary + 4) {
                            let shiftedLx = lx + (Math.random() > 0.94 ? Math.floor(Math.sin(ly)*4) : 0);
                            htmlOutput += getTextCell(shiftedLx, ly);
                        } else {
                            htmlOutput += getRandomGlitch();
                        }
                        break;
                    }

                    case "LASER_SCAN": {
                        let scanY = progress * GRID_H;
                        if (ly < scanY - 0.5) {
                            htmlOutput += getTextCell(lx, ly);
                        } else if (Math.abs(ly - scanY) <= 1) {
                            htmlOutput += `<span style="color:#ffffff; background-color:#00a2ff; text-shadow:0 0 14px #fff;">█</span>`;
                        } else {
                            htmlOutput += getLogoCell(lx, ly);
                        }
                        break;
                    }

                    case "MATRIX_CASCADE": {
                        let columnDelay = (Math.sin(lx * 13.7) * 0.5 + 0.5) * 0.4;
                        let colProgress = (progress - columnDelay) / (1.0 - columnDelay);
                        let dropY = colProgress * (GRID_H + 5);

                        if (ly < dropY - 1) {
                            htmlOutput += getLogoCell(lx, ly);
                        } else if (Math.abs(ly - dropY) <= 1 && ly < GRID_H) {
                            htmlOutput += `<span style="color:#00f5ff; text-shadow:0 0 12px #00f5ff;">█</span>`;
                        } else {
                            htmlOutput += getTextCell(lx, ly);
                        }
                        break;
                    }

                    case "NOISE_CRASH": {
                        let blockX = Math.floor(lx / 4);
                        let blockY = Math.floor(ly / 2);
                        let blockNoise = Math.sin(blockX * 41.2 + blockY * 73.1 + frame * 0.05) * 0.5 + 0.5;
                        
                        if (blockNoise < progress * 0.7) {
                            htmlOutput += getTextCell(lx, ly);
                        } else if (blockNoise > progress + 0.2) {
                            htmlOutput += getLogoCell(lx, ly);
                        } else {
                            htmlOutput += getRandomGlitch();
                        }
                        break;
                    }
                }
            }
            htmlOutput += "\n";
        }

        termElement.innerHTML = htmlOutput;

        if (forceGlitch > 0) forceGlitch--;

        frame++;
        stateFrame++;
        if (stateFrame >= state.duration) {
            stateFrame = 0;
            stateIdx = (stateIdx + 1) % states.length;
        }

        // Рандомизация значения пинга для живости
        if (frame % 60 === 0) {
            pingElement.innerText = `PING: ${Math.floor(18 + Math.random() * 12)}ms`;
        }
    }

    // Оптимизированный игровой цикл на requestAnimationFrame
    let lastTick = 0;
    const FPS_INTERVAL = 1000 / 30; // 30 кадров в секунду для ретро-стиля

    function mainLoop(timestamp) {
        requestAnimationFrame(mainLoop);
        const elapsed = timestamp - lastTick;
        if (elapsed > FPS_INTERVAL) {
            lastTick = timestamp - (elapsed % FPS_INTERVAL);
            render();
        }
    }

    function autoScale() {
        const padding = 40;
        const availableW = window.innerWidth - padding;
        const availableH = window.innerHeight - 140; // Место под шапку и футер

        const baseW = termElement.scrollWidth || 700;
        const baseH = termElement.scrollHeight || 420;

        const scale = Math.min(availableW / baseW, availableH / baseH, 1.2);
        termElement.style.transform = `scale(${Math.max(scale, 0.3)})`;
    }

    // Интерактив: взрыв глитча по клику
    window.addEventListener('pointerdown', () => {
        forceGlitch = 12;
    });

    window.addEventListener('resize', autoScale);
    
    // Запуск
    requestAnimationFrame((t) => {
        autoScale();
        mainLoop(t);
        setTimeout(autoScale, 50);
    });
</script>
</body>
</html>
